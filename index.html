<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CAW Account Check</title>
  <meta name="description" content="Check CAW V2 wallet delegation, allowances, L1/L2 profile balances, session keys, and marketplace claims directly via RPC without relying on node APIs.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https: http:; img-src 'self' data:; base-uri 'none';">
  <style>
:root {
  --bg: #0f1014;
  --surface: #171920;
  --surface2: #1e2129;
  --line: #2a2e38;
  --fg: #eceef3;
  --mute: #9aa1b2;
  --faint: #6b7283;
  --accent: #f2b134;
  --accent-ink: #1a1405;
  --link: #7cc8ff;
  --ok: #5fd08a;
  --warn: #f0c14b;
  --bad: #ef6f8f;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface2: #f0f2f5;
    --line: #dde1e8;
    --fg: #161922;
    --mute: #566074;
    --faint: #7a8497;
    --accent: #b97800;
    --accent-ink: #ffffff;
    --link: #0b6aa8;
    --ok: #1f8f4e;
    --warn: #9a7300;
    --bad: #c23a63;
  }
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.6 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
}
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.9em;
}
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 18px 40px; }

.top {
  padding: 26px 0 14px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 14px;
  flex-wrap: wrap;
}
.brand h1 { margin: 0; font: 700 26px/1.2 Georgia, serif; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 4px 0 0; color: var(--mute); font-size: 14px; }
.badges { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 999px;
  overflow: hidden;
  background: var(--surface);
}
.seg button {
  all: unset;
  cursor: pointer;
  padding: 4px 12px;
  font-size: 13px;
  color: var(--mute);
  box-sizing: border-box;
}
.seg button[aria-pressed="true"] {
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 600;
}
.seg button:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.pill {
  display: inline-block;
  font-size: 12px;
  line-height: 1.4;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 3px 10px;
  color: var(--mute);
  max-width: 100%;
  overflow-wrap: anywhere;
}
.pill.ok { border-color: color-mix(in srgb, var(--ok) 45%, transparent); color: var(--ok); }
.pill.info { border-color: color-mix(in srgb, var(--link) 45%, transparent); color: var(--link); }
.pill.warn { border-color: color-mix(in srgb, var(--warn) 50%, transparent); color: var(--warn); }
.pill.bad { border-color: color-mix(in srgb, var(--bad) 50%, transparent); color: var(--bad); }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 16px;
}

.input-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.grow { flex: 1 1 320px; }
.action-col { flex: 0 0 auto; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12.5px; color: var(--mute); }
.field input, .field select {
  background: var(--surface2);
  color: var(--fg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 12px;
  font: inherit;
  width: 100%;
}
.field input:focus, .field select:focus { outline: 2px solid var(--link); outline-offset: 1px; }

.btn {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 18px;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  background: var(--surface2);
  color: var(--fg);
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: 0.6; cursor: wait; }

details.advanced { margin-top: 12px; }
details.advanced summary { cursor: pointer; color: var(--mute); font-size: 13px; user-select: none; }
.adv-grid {
  margin-top: 12px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 12px;
}

.status-bar { margin-top: 12px; font-size: 13px; color: var(--mute); }
.error-box {
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid color-mix(in srgb, var(--bad) 50%, transparent);
  background: color-mix(in srgb, var(--bad) 10%, transparent);
  color: var(--bad);
  font-size: 13.5px;
}

.sec-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 8px;
}
.sec-head h2 { margin: 0; font-size: 17px; }
.sec-sub { color: var(--faint); font-size: 12.5px; }

.kv-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 10px;
}
@media (min-width: 860px) {
  .kv-grid.kv-resolved {
    grid-template-columns: minmax(360px, 1.5fr) 1fr 1fr;
  }
}
.kv-box {
  background: var(--surface2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 11px 13px;
  min-width: 0;
}
.kv-k { font-size: 12px; color: var(--mute); margin-bottom: 4px; }
.kv-v {
  font-size: 14px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  overflow-wrap: break-word;
}
.kv-v.addr-full {
  font-size: clamp(10.5px, 2.5vw, 13px);
  white-space: nowrap;
  overflow-x: auto;
  overflow-wrap: normal;
}
.note-line {
  color: var(--mute);
  font-size: 12.8px;
  line-height: 1.55;
  margin: 8px 0 0;
  line-break: strict;
  overflow-wrap: break-word;
}
.del-addr-row {
  margin-top: 7px;
  padding-top: 7px;
  border-top: 1px dashed var(--line);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.del-addr-lbl { font-size: 11.5px; color: var(--faint); }
.del-addr-row a.mono,
.del-addr-row span.mono {
  font-size: clamp(10px, 2.3vw, 11.5px);
  white-space: nowrap;
  overflow-x: auto;
}
.sec-guide {
  background: var(--surface2);
  border-left: 3px solid var(--accent);
  padding: 8px 12px;
  border-radius: 0 8px 8px 0;
  color: var(--mute);
  font-size: 13px;
  margin-bottom: 12px;
  line-break: strict;
}
.sum-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}
@media (min-width: 560px) and (max-width: 759px) {
  .sum-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .sum-grid > .sum-card:last-child { grid-column: span 2; }
}
@media (min-width: 760px) {
  .sum-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .sum-grid > .sum-card:nth-child(-n+3) { grid-column: span 2; }
  .sum-grid > .sum-card:nth-child(n+4) { grid-column: span 3; }
}
.sum-card {
  background: var(--surface2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  min-width: 0;
}
.sum-card.ok { border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.sum-card.info { border-color: color-mix(in srgb, var(--link) 45%, transparent); }
.sum-card.warn { border-color: color-mix(in srgb, var(--warn) 55%, transparent); }
.sum-card.bad { border-color: color-mix(in srgb, var(--bad) 55%, transparent); }
.sum-title { font-size: 12px; color: var(--mute); margin-bottom: 4px; }
.sum-status {
  font-size: 14px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  margin-bottom: 5px;
  line-height: 1.4;
}
.sum-desc {
  font-size: 12.5px;
  color: var(--mute);
  line-height: 1.55;
  line-break: strict;
  overflow-wrap: break-word;
}
.hint-sub { display: block; font-size: 11.5px; color: var(--faint); font-weight: 400; margin-top: 2px; }

.tbl-wrap { overflow-x: auto; margin-top: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--mute); font-weight: 600; font-size: 12px; white-space: nowrap; }
td.mono { white-space: nowrap; font-size: 12.5px; }
td.nowrap, .tbl-wrap .pill { white-space: nowrap; }
.prof-cell { white-space: nowrap; }
.prof-id { display: inline-block; min-width: 2.2em; color: var(--mute); font-size: 12.5px; margin-right: 4px; }
.val-main { display: inline-block; white-space: nowrap; font-weight: 600; }
.tbl-profiles .hint-sub { white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.empty { color: var(--faint); font-size: 13.5px; margin: 4px 0; }

footer {
  margin-top: 20px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  color: var(--faint);
  font-size: 12.5px;
}
  </style>
</head>

  <div class="wrap">

        <div class="sec-head">
          <h2 data-i18n="h_sec1"></h2>
          <span class="sec-sub" data-i18n="sub_sec1"></span>
        </div>
        <div id="security-section"></div>

  <script>
(() => {
'use strict';

// --- lib/contracts.js ---

const SELECTORS = {

// Solidity enum ActionType { CAW, LIKE, UNLIKE, RECAW, FOLLOW, UNFOLLOW, WITHDRAW, OTHER }
const ACTION_SCOPE_NAMES = [
  'CAW',
  'LIKE',
  'UNLIKE',
  'RECAW',
  'FOLLOW',
  'UNFOLLOW',
  'WITHDRAW',
  'OTHER',
];

const LISTING_TYPES = ['FIXED', 'DUTCH_AUCTION', 'ENGLISH_AUCTION'];

const ZERO_ADDRESS = '0x0000000000000000000000000000000000000000';
const MAX_UINT256 = (1n << 256n) - 1n;

// Shared EIP-7702 singleton delegators verified on-chain (non-CAW wallet smart accounts).
const KNOWN_DELEGATORS = {
  '0x63c0c19a282a1b52b07dd5a65b58948a07dae32b': {
    id: 'metamask_7702',
    label: 'MetaMask (EIP7702StatelessDeleGator)',
    shortLabel: 'MetaMask',
  },
};

function findKnownDelegator(address) {
  if (!address) return null;
  return KNOWN_DELEGATORS[String(address).toLowerCase()] || null;
}

// --- lib/abi.js ---
// Minimal dependency-free ABI encoder/decoder and hex formatting helpers.
const utf8Encoder = new TextEncoder();
const utf8Decoder = new TextDecoder();

function strip0x(hex) {
  return typeof hex === 'string' && (hex.startsWith('0x') || hex.startsWith('0X'))
    ? hex.slice(2)
    : String(hex || '');
}

function isValidAddress(addr) {
  return typeof addr === 'string' && /^0x[0-9a-fA-F]{40}$/i.test(addr.trim());
}

function normalizeAddress(addr) {
  if (!isValidAddress(addr)) {
    throw new Error(`Invalid address: ${addr}`);
  }
  return '0x' + addr.trim().slice(2).toLowerCase();
}

function padAddress(addr) {
  return normalizeAddress(addr).slice(2).padStart(64, '0');
}

function padUint(value) {
  const n = typeof value === 'bigint' ? value : BigInt(value);
  if (n < 0n) throw new Error('Negative uint not supported');
  return n.toString(16).padStart(64, '0');
}

function encodeAddressArgCall(selector, address) {
  return selector + padAddress(address);
}

function encodeUintArgCall(selector, value) {
  return selector + padUint(value);
}

function encodeAddressAddressCall(selector, a, b) {
  return selector + padAddress(a) + padAddress(b);
}

function encodeAddressUintCall(selector, addr, num) {
  return selector + padAddress(addr) + padUint(num);
}

function encodeStringArgCall(selector, str) {
  const bytes = utf8Encoder.encode(str);
  const offset = padUint(32);
  const len = padUint(bytes.length);
  let hex = '';
  for (const b of bytes) hex += b.toString(16).padStart(2, '0');
  const rem = bytes.length % 32;
  if (rem !== 0) hex += '00'.repeat(32 - rem);
  return selector + offset + len + hex;
}

function readWordHex(rawHex, byteOffset) {
  const start = byteOffset * 2;
  if (start + 64 > rawHex.length) {
    throw new Error(`ABI out of bounds at byte ${byteOffset} (len=${rawHex.length / 2})`);
  }
  return rawHex.slice(start, start + 64);
}

function readUint(rawHex, byteOffset) {
  return BigInt('0x' + readWordHex(rawHex, byteOffset));
}

function readBool(rawHex, byteOffset) {
  return readUint(rawHex, byteOffset) !== 0n;
}

function readAddress(rawHex, byteOffset) {
  return '0x' + readWordHex(rawHex, byteOffset).slice(24).toLowerCase();
}

function readDynamicString(rawHex, structBaseByteOffset, offsetSlotByteOffset) {
  const relOffset = Number(readUint(rawHex, offsetSlotByteOffset));
  const strStart = structBaseByteOffset + relOffset;
  const byteLen = Number(readUint(rawHex, strStart));
  const hexStart = (strStart + 32) * 2;
  const hexEnd = hexStart + byteLen * 2;
  if (hexEnd > rawHex.length) {
    throw new Error(`ABI string out of bounds (need ${hexEnd}, got ${rawHex.length})`);
  }
  const bytes = new Uint8Array(byteLen);
  for (let i = 0; i < byteLen; i++) {
    bytes[i] = parseInt(rawHex.slice(hexStart + i * 2, hexStart + i * 2 + 2), 16);
  }
  return utf8Decoder.decode(bytes);
}

function decodeSingleUint(hexResult) {
  const raw = strip0x(hexResult);
  if (raw.length < 64) return 0n;
  return readUint(raw, 0);
}

function decodeSingleAddress(hexResult) {
  const raw = strip0x(hexResult);
  if (raw.length < 64) return null;
  return readAddress(raw, 0);
}

function decodeSingleString(hexResult) {
  const raw = strip0x(hexResult);
  if (raw.length < 128) return '';
  return readDynamicString(raw, 0, 0);
}

// Decodes CawProfileLens.tokenByUsername(string) -> struct Token
function decodeLensToken(hexResult) {
  const raw = strip0x(hexResult);
  if (raw.length < 64) throw new Error('Empty tokenByUsername response');
  const structStart = Number(readUint(raw, 0));
  return {
    tokenId: Number(readUint(raw, structStart)),
    username: readDynamicString(raw, structStart, structStart + 32),
    owner: readAddress(raw, structStart + 64),
    ownerBalance: readUint(raw, structStart + 96),
    withdrawable: readUint(raw, structStart + 128),
  };
}

// Decodes CawProfileLens.profilesWithNetworkState(address,uint32) -> TokenWithNetworkState[]
function decodeProfilesWithNetworkState(hexResult) {
  const raw = strip0x(hexResult);
  if (raw.length < 128) return [];
  const arrayStart = Number(readUint(raw, 0));
  const count = Number(readUint(raw, arrayStart));
  const elemsBase = arrayStart + 32;
  const items = [];
  for (let i = 0; i < count; i++) {
    const relOffset = Number(readUint(raw, elemsBase + i * 32));
    const s = elemsBase + relOffset;
    items.push({
      tokenId: Number(readUint(raw, s)),
      username: readDynamicString(raw, s, s + 32),
      owner: readAddress(raw, s + 64),
      ownerBalance: readUint(raw, s + 96),
      withdrawable: readUint(raw, s + 128),
      authenticated: readBool(raw, s + 160),
      withdrawFeeLocked: readBool(raw, s + 192),
      lockedWithdrawFee: readUint(raw, s + 224),
    });
  }
  return items;
}

// Decodes CawProfileLedger.validSession(address,address) -> StoredSession
function decodeStoredSession(hexResult) {
  const raw = strip0x(hexResult);
  if (raw.length < 384) {
    throw new Error('Invalid StoredSession response length');
  }
  return {
    expiry: Number(readUint(raw, 0)),
    scopeBitmap: Number(readUint(raw, 32)),
    epoch: Number(readUint(raw, 64)),
    perActionTipRate: readUint(raw, 96),
    profileId: Number(readUint(raw, 128)),
    spendLimit: readUint(raw, 160),
  };
}

// Decodes CawProfileMarketplace.offers(uint256)
function decodeOffer(hexResult) {
  const raw = strip0x(hexResult);
  if (raw.length < 384) throw new Error('Invalid Offer response length');
  return {
    offerer: readAddress(raw, 0),
    tokenId: Number(readUint(raw, 32)),
    paymentToken: readAddress(raw, 64),
    amount: readUint(raw, 96),
    expiry: Number(readUint(raw, 128)),
    active: readBool(raw, 160),
  };
}

// Decodes CawProfileMarketplace.listings(uint256)
function decodeListing(hexResult) {
  const raw = strip0x(hexResult);
  if (raw.length < 704) throw new Error('Invalid Listing response length');
  const typeIdx = Number(readUint(raw, 96));
  return {
    tokenId: Number(readUint(raw, 0)),
    seller: readAddress(raw, 32),
    paymentToken: readAddress(raw, 64),
    listingType: LISTING_TYPES[typeIdx] ?? `UNKNOWN(${typeIdx})`,
    startPrice: readUint(raw, 128),
    endPrice: readUint(raw, 160),
    startTime: Number(readUint(raw, 192)),
    endTime: Number(readUint(raw, 224)),
    highestBid: readUint(raw, 256),
    highestBidder: readAddress(raw, 288),
    active: readBool(raw, 320),
  };
}

function decodeScopeBitmap(bitmap) {
  const allowed = [];
  for (let bit = 0; bit < ACTION_SCOPE_NAMES.length; bit++) {
    if ((bitmap & (1 << bit)) !== 0) {
      allowed.push(ACTION_SCOPE_NAMES[bit]);
    }
  }
  return allowed;
}

// EIP-7702 delegation indicator: 0xef0100 || 20-byte delegate address (total 23 bytes = 46 hex chars)
function parseEip7702Code(codeHex) {
  const clean = strip0x(codeHex).toLowerCase();
  if (!clean) return { delegated: false, delegate: null, codeBytes: 0, isEoa: true };
  if (clean.length === 46 && clean.startsWith('ef0100')) {
    return {
      delegated: true,
      delegate: '0x' + clean.slice(6),
      codeBytes: 23,
      isEoa: false,
    };
  }
  return {
    delegated: false,
    delegate: null,
    codeBytes: clean.length / 2,
    isEoa: false,
  };
}

function formatUnits(value, decimals = 18, maxFrac = 4) {
  const v = typeof value === 'bigint' ? value : BigInt(value);
  if (v === 0n) return '0';
  const neg = v < 0n;
  const abs = neg ? -v : v;
  const base = 10n ** BigInt(decimals);
  const whole = abs / base;
  const frac = abs % base;
  const wholeStr = whole.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  if (frac === 0n || maxFrac <= 0) return (neg ? '-' : '') + wholeStr;
  const fracFull = frac.toString().padStart(decimals, '0').slice(0, maxFrac).replace(/0+$/, '');
  return (neg ? '-' : '') + (fracFull ? `${wholeStr}.${fracFull}` : wholeStr);
}

function formatAllowance(value, decimals = 18) {
  const v = typeof value === 'bigint' ? value : BigInt(value);
  if (v >= MAX_UINT256 / 2n) {
    return { text: '無制限', sub: 'Unlimited (MaxUint256)', unlimited: true };
  }
  if (v === 0n) {
    return { text: '0 (承認なし)', sub: null, unlimited: false };
  }
  return { text: `${formatUnits(v, decimals)} CAW`, sub: null, unlimited: false };
}

function shortAddr(addr) {
  if (!addr || addr.length < 12) return String(addr || '');
  return `${addr.slice(0, 8)}...${addr.slice(-6)}`;
}

// --- lib/rpc.js ---
// Minimal JSON-RPC client with chainId verification and adaptive chunked eth_getLogs.

class RpcError extends Error {
  constructor(message, { code, status } = {}) {
    super(message);
    this.name = 'RpcError';
    this.code = code;
    this.status = status;
  }
}

function createRpcClient(url, { expectedChainId, timeoutMs = 12_000, fetchImpl = globalThis.fetch } = {}) {
  if (!url || (!url.startsWith('https://') && !url.startsWith('http://'))) {
    throw new Error('RPC URL must start with https:// or http://');
  }
  let nextId = 1;
  let chainVerified = false;

  async function callRaw(method, params = []) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const res = await fetchImpl(url, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ jsonrpc: '2.0', id: nextId++, method, params }),
        signal: controller.signal,
      });
      if (!res.ok) {
        const txt = await res.text().catch(() => '');
        throw new RpcError(`HTTP ${res.status} from RPC: ${txt.slice(0, 140)}`, { status: res.status });
      }
      const data = await res.json();
      if (data?.error) {
        throw new RpcError(`RPC error (${data.error.code ?? 'unknown'}): ${data.error.message ?? 'unknown'}`, {
          code: data.error.code,
        });
      }
      return data.result;
    } finally {
      clearTimeout(timer);
    }
  }

  async function ensureChainId() {
    if (chainVerified || !expectedChainId) return;
    const hexId = await callRaw('eth_chainId');
    const actual = Number(BigInt(hexId));
    if (actual !== expectedChainId) {
      throw new RpcError(`RPC chainId mismatch: expected ${expectedChainId}, got ${actual}`);
    }
    chainVerified = true;
  }

  async function getBlockNumber() {
    await ensureChainId();
    const hex = await callRaw('eth_blockNumber');
    return Number(BigInt(hex));
  }

  async function getCode(address) {
    await ensureChainId();
    return callRaw('eth_getCode', [address, 'latest']);
  }

  async function ethCall(to, data) {
    await ensureChainId();
    return callRaw('eth_call', [{ to, data }, 'latest']);
  }

  function isRangeLimitError(err) {
    if (err?.status === 413) return true;
    const msg = String(err?.message || '').toLowerCase();
    return (
      msg.includes('range') ||
      msg.includes('too large') ||
      msg.includes('exceed') ||
      msg.includes('limit') ||
      msg.includes('more than')
    );
  }

  // Scans [fromBlock, toBlock] newest-first with adaptive chunk shrinking on RPC range caps.
  async function getLogsChunked({ address, topics, fromBlock, toBlock, initialChunk = 45_000, minChunk = 200, maxChunks = 40 }) {
    await ensureChainId();
    const logs = [];
    let cursor = Math.max(0, toBlock);
    const floor = Math.max(0, fromBlock);
    let chunk = Math.max(minChunk, initialChunk);
    let chunksUsed = 0;
    let truncated = false;

    while (cursor >= floor) {
      if (chunksUsed >= maxChunks) {
        truncated = true;
        break;
      }
      const start = Math.max(floor, cursor - chunk + 1);
      try {
        const res = await callRaw('eth_getLogs', [{
          address,
          topics,
          fromBlock: '0x' + start.toString(16),
          toBlock: '0x' + cursor.toString(16),
        }]);
        if (Array.isArray(res)) logs.push(...res);
        cursor = start - 1;
        chunksUsed++;
      } catch (err) {
        if (isRangeLimitError(err) && chunk > minChunk) {
          chunk = Math.max(minChunk, Math.floor(chunk / 4));
          continue;
        }
        throw err;
      }
    }

    // Sort chronologically (blockNumber, logIndex)
    logs.sort((a, b) => {
      const ba = Number(BigInt(a.blockNumber || '0x0'));
      const bb = Number(BigInt(b.blockNumber || '0x0'));
      if (ba !== bb) return ba - bb;
      return Number(BigInt(a.logIndex || '0x0')) - Number(BigInt(b.logIndex || '0x0'));
    });

    return {
      logs,
      scannedFrom: Math.max(floor, cursor + 1),
      scannedTo: toBlock,
      chunksUsed,
      truncated,
    };
  }

  return {
    url,
    callRaw,
    ensureChainId,
    getBlockNumber,
    getCode,
    ethCall,
    getLogsChunked,
  };
}

// --- lib/rescue.js ---
// Read-only rescue inspection logic built strictly over L1 & L2 JSON-RPC calls.
async function resolveTarget(l1Rpc, rawInput, contractsL1) {
  const trimmed = String(rawInput || '').trim();
  if (!trimmed) {
    throw new Error('ウォレットアドレス、@username、または tokenId を入力してください');
  }

  if (isValidAddress(trimmed)) {
    return {
      address: normalizeAddress(trimmed),
      resolvedVia: 'address',
      tokenId: null,
      username: null,
    };
  }

  const tokenMatch = trimmed.match(/^#?(\d+)$/);
  if (tokenMatch) {
    const tokenId = Number(tokenMatch[1]);
    if (!Number.isInteger(tokenId) || tokenId <= 0) {
      throw new Error('tokenId は 1 以上の整数を指定してください');
    }
    const res = await l1Rpc.ethCall(
      contractsL1.CawProfile,
      encodeUintArgCall(SELECTORS.ownerOf, tokenId),
    );
    const owner = decodeSingleAddress(res);
    if (!owner || owner === ZERO_ADDRESS) {
      throw new Error(`tokenId #${tokenId} のオーナーが見つかりませんでした`);
    }
    return {
      address: owner,
      resolvedVia: 'tokenId',
      tokenId,
      username: null,
    };
  }

  const username = trimmed.replace(/^@/, '').toLowerCase();
  const res = await l1Rpc.ethCall(
    contractsL1.CawProfileLens,
    encodeStringArgCall(SELECTORS.tokenByUsername, username),
  );
  const token = decodeLensToken(res);
  if (!token.tokenId || token.owner === ZERO_ADDRESS) {
    throw new Error(`@${username} に該当するプロフィールが L1 で見つかりませんでした`);
  }
  return {
    address: token.owner,
    resolvedVia: 'username',
    tokenId: token.tokenId,
    username: token.username || username,
  };
}

function summarizeSmartEoaLogs(logs) {
  const passkeys = new Map(); // pubkeyHash -> { status, validFrom, blockNumber }
  let lastFallback = null;

  for (const log of logs) {
    const topic0 = (log.topics?.[0] || '').toLowerCase();
    const blockNumber = Number(BigInt(log.blockNumber || '0x0'));
    if (topic0 === TOPICS.PasskeyAdded) {
      const hash = (log.topics?.[1] || '').toLowerCase();
      const validFrom = log.data && log.data !== '0x' ? Number(BigInt(log.data)) : 0;
      passkeys.set(hash, { status: 'pending', validFrom, blockNumber });
    } else if (topic0 === TOPICS.PasskeyActivated) {
      const hash = (log.topics?.[1] || '').toLowerCase();
      const prev = passkeys.get(hash) || {};
      passkeys.set(hash, { ...prev, status: 'active', validFrom: 0, blockNumber });
    } else if (topic0 === TOPICS.PasskeyRemoved) {
      const hash = (log.topics?.[1] || '').toLowerCase();
      passkeys.set(hash, { status: 'removed', validFrom: 0, blockNumber });
    } else if (topic0 === TOPICS.PasskeyCancelled) {
      const hash = (log.topics?.[1] || '').toLowerCase();
      passkeys.set(hash, { status: 'cancelled', validFrom: 0, blockNumber });
    } else if (topic0 === TOPICS.EcdsaFallbackRotated) {
      const t1 = log.topics?.[1];
      if (t1 && t1.length >= 42) {
        lastFallback = '0x' + t1.slice(-40).toLowerCase();
      }
    }
  }

  return {
    passkeys: Array.from(passkeys.entries()).map(([hash, info]) => ({ hash, ...info })),
    lastFallback,
  };
}

async function inspectChainDelegation(rpc, address, expectedSmartEoa, lookbackBlocks) {
  const [blockNumber, codeHex] = await Promise.all([
    rpc.getBlockNumber(),
    rpc.getCode(address),
  ]);
  const parsed = parseEip7702Code(codeHex);
  const expected = normalizeAddress(expectedSmartEoa);
  const matchesOfficial = parsed.delegated && parsed.delegate === expected;
  const knownDelegator = parsed.delegated && !matchesOfficial ? findKnownDelegator(parsed.delegate) : null;

  let managementNonce = null;
  let executeNonce = null;
  let eventSummary = null;
  let logError = null;
  let logTruncated = false;

  // SmartEOA nonces and Passkey logs only apply when delegated to CAW's SmartEOA contract.
  if (matchesOfficial) {
    const [mRes, eRes] = await Promise.all([
      rpc.ethCall(address, SELECTORS.managementNonceOf).catch(() => null),
      rpc.ethCall(address, SELECTORS.executeNonceOf).catch(() => null),
    ]);
    if (mRes && strip0x(mRes).length >= 64) managementNonce = Number(decodeSingleUint(mRes));
    if (eRes && strip0x(eRes).length >= 64) executeNonce = Number(decodeSingleUint(eRes));

    if (lookbackBlocks > 0) {
      try {
        const res = await rpc.getLogsChunked({
          address,
          topics: [[
            TOPICS.PasskeyAdded,
            TOPICS.PasskeyActivated,
            TOPICS.PasskeyRemoved,
            TOPICS.PasskeyCancelled,
            TOPICS.EcdsaFallbackRotated,
          ]],
          fromBlock: Math.max(0, blockNumber - lookbackBlocks),
          toBlock: blockNumber,
        });
        eventSummary = summarizeSmartEoaLogs(res.logs);
        logTruncated = res.truncated;
      } catch (err) {
        logError = err?.message || String(err);
      }
    }
  }

  return {
    blockNumber,
    ...parsed,
    expectedSmartEoa: expected,
    matchesOfficial,
    knownDelegator,
    managementNonce,
    executeNonce,
    eventSummary,
    logError,
    logTruncated,
  };
}

async function inspectAccountSecurity(l1Rpc, l2Rpc, owner, contracts, { lookbackBlocks = 50_000, extraSpenders = [] } = {}) {
  const [l1Delegation, l2Delegation, cawBalanceHex, decimalsHex, symbolHex] = await Promise.all([
    inspectChainDelegation(l1Rpc, owner, contracts.L1.SmartEOA, lookbackBlocks),
    inspectChainDelegation(l2Rpc, owner, contracts.L2.SmartEOA, lookbackBlocks),
    l1Rpc.ethCall(contracts.L1.MintableCaw, encodeAddressArgCall(SELECTORS.balanceOf, owner)),
    l1Rpc.ethCall(contracts.L1.MintableCaw, SELECTORS.decimals).catch(() => '0x12'),
    l1Rpc.ethCall(contracts.L1.MintableCaw, SELECTORS.symbol).catch(() => ''),
  ]);

  const spenders = [
    { label: 'CawProfileMinter', address: normalizeAddress(contracts.L1.CawProfileMinter) },
    { label: 'CawProfile', address: normalizeAddress(contracts.L1.CawProfile) },
    { label: 'CawProfileMarketplace', address: normalizeAddress(contracts.L1.CawProfileMarketplace) },
  ];
  for (const s of extraSpenders) {
    if (isValidAddress(s)) {
      const norm = normalizeAddress(s);
      if (!spenders.some(x => x.address === norm)) {
        spenders.push({ label: 'Custom Spender', address: norm });
      }
    }
  }

  const allowances = await Promise.all(
    spenders.map(async s => {
      const hex = await l1Rpc.ethCall(
        contracts.L1.MintableCaw,
        encodeAddressAddressCall(SELECTORS.allowance, owner, s.address),
      );
      const amount = decodeSingleUint(hex);
      return {
        ...s,
        amount,
        unlimited: amount >= MAX_UINT256 / 2n,
      };
    }),
  );

  return {
    l1Delegation,
    l2Delegation,
    caw: {
      address: normalizeAddress(contracts.L1.MintableCaw),
      symbol: decodeSingleString(symbolHex) || 'CAW',
      decimals: Number(decodeSingleUint(decimalsHex) || 18n),
      walletBalance: decodeSingleUint(cawBalanceHex),
    },
    allowances,
  };
}

async function inspectProfiles(l1Rpc, l2Rpc, owner, networkId, contracts) {
  const hex = await l1Rpc.ethCall(
    contracts.L1.CawProfileLens,
    encodeAddressUintCall(SELECTORS.profilesWithNetworkState, owner, networkId),
  );
  const profiles = decodeProfilesWithNetworkState(hex);

  const enriched = await Promise.all(
    profiles.map(async p => {
      const [l2BalHex, l2OwnerHex, sponsorRepayHex] = await Promise.all([
        l2Rpc.ethCall(contracts.L2.CawProfileLedger, encodeUintArgCall(SELECTORS.cawBalanceOf, p.tokenId)),
        l2Rpc.ethCall(contracts.L2.CawProfileLedger, encodeUintArgCall(SELECTORS.ownerOf, p.tokenId)).catch(() => null),
        l2Rpc.ethCall(contracts.L2.CawProfileLedger, encodeUintArgCall(SELECTORS.sponsorRepay, p.tokenId)).catch(() => '0x0'),
      ]);
      const l2Owner = l2OwnerHex ? decodeSingleAddress(l2OwnerHex) : null;
      return {
        ...p,
        l2Balance: decodeSingleUint(l2BalHex),
        l2Owner,
        ownerSynced: l2Owner !== null && l2Owner === p.owner,
        sponsorRepay: decodeSingleUint(sponsorRepayHex),
      };
    }),
  );

  return enriched;
}

async function inspectSessions(l2Rpc, owner, l2BlockNumber, contracts, { lookbackBlocks = 100_000, extraSessionKeys = [], nowSec = Math.floor(Date.now() / 1000) } = {}) {
  const [epochHex, nonceHex] = await Promise.all([
    l2Rpc.ethCall(contracts.L2.CawProfileLedger, encodeAddressArgCall(SELECTORS.ownerSessionEpoch, owner)),
    l2Rpc.ethCall(contracts.L2.CawProfileLedger, encodeAddressArgCall(SELECTORS.sessionNonce, owner)),
  ]);

  const ownerTopic = '0x' + padAddress(owner);
  const historyMap = new Map(); // sessionKey -> { createdAtBlock, revokedAtBlock }
  let logError = null;
  let logTruncated = false;

  if (lookbackBlocks > 0) {
    try {
      const res = await l2Rpc.getLogsChunked({
        address: contracts.L2.CawProfileLedger,
        topics: [[TOPICS.SessionCreated, TOPICS.SessionRevoked], ownerTopic],
        fromBlock: Math.max(0, l2BlockNumber - lookbackBlocks),
        toBlock: l2BlockNumber,
      });
      logTruncated = res.truncated;
      for (const log of res.logs) {
        const t0 = (log.topics?.[0] || '').toLowerCase();
        const t2 = log.topics?.[2];
        if (!t2 || t2.length < 42) continue;
        const key = '0x' + t2.slice(-40).toLowerCase();
        const block = Number(BigInt(log.blockNumber || '0x0'));
        const cur = historyMap.get(key) || { createdAtBlock: null, revokedAtBlock: null };
        if (t0 === TOPICS.SessionCreated) cur.createdAtBlock = block;
        if (t0 === TOPICS.SessionRevoked) cur.revokedAtBlock = block;
        historyMap.set(key, cur);
      }
    } catch (err) {
      logError = err?.message || String(err);
    }
  }

  for (const rawKey of extraSessionKeys) {
    if (isValidAddress(rawKey)) {
      const k = normalizeAddress(rawKey);
      if (!historyMap.has(k)) {
        historyMap.set(k, { createdAtBlock: null, revokedAtBlock: null, manual: true });
      }
    }
  }

  const keys = Array.from(historyMap.keys());
  const sessions = await Promise.all(
    keys.map(async sessionKey => {
      const [validHex, spentHex] = await Promise.all([
        l2Rpc.ethCall(contracts.L2.CawProfileLedger, encodeAddressAddressCall(SELECTORS.validSession, owner, sessionKey)),
        l2Rpc.ethCall(contracts.L2.CawActions, encodeAddressAddressCall(SELECTORS.sessionSpent, owner, sessionKey)),
      ]);
      const stored = decodeStoredSession(validHex);
      const spent = decodeSingleUint(spentHex);
      const hist = historyMap.get(sessionKey);

      let status = 'inactive';
      if (stored.expiry === 0) {
        status = hist?.revokedAtBlock ? 'revoked' : hist?.createdAtBlock ? 'invalidated' : 'not_found';
      } else if (stored.expiry <= nowSec) {
        status = 'expired';
      } else {
        status = 'active';
      }

      return {
        sessionKey,
        status,
        ...stored,
        scopes: decodeScopeBitmap(stored.scopeBitmap),
        spent,
        history: hist,
      };
    }),
  );

  sessions.sort((a, b) => {
    const rank = s => (s === 'active' ? 0 : s === 'expired' ? 1 : 2);
    return rank(a.status) - rank(b.status) || b.expiry - a.expiry;
  });

  return {
    ownerSessionEpoch: Number(decodeSingleUint(epochHex)),
    sessionNonce: Number(decodeSingleUint(nonceHex)),
    sessions,
    logError,
    logTruncated,
  };
}

async function inspectMarketplace(l1Rpc, owner, contracts, { maxScanIds = 150, nowSec = Math.floor(Date.now() / 1000) } = {}) {
  const mp = contracts.L1.CawProfileMarketplace;
  const [ethPayoutHex, cawPayoutHex, nextOfferHex, nextListingHex] = await Promise.all([
    l1Rpc.ethCall(mp, encodeAddressArgCall(SELECTORS.pendingPayouts, owner)),
    l1Rpc.ethCall(mp, encodeAddressAddressCall(SELECTORS.pendingTokenPayouts, owner, contracts.L1.MintableCaw)),
    l1Rpc.ethCall(mp, SELECTORS.nextOfferId),
    l1Rpc.ethCall(mp, SELECTORS.nextListingId),
  ]);

  const nextOfferId = Number(decodeSingleUint(nextOfferHex));
  const nextListingId = Number(decodeSingleUint(nextListingHex));

  const offerStart = Math.max(1, nextOfferId - maxScanIds);
  const offerIds = [];
  for (let id = offerStart; id < nextOfferId; id++) offerIds.push(id);

  const listingStart = Math.max(1, nextListingId - maxScanIds);
  const listingIds = [];
  for (let id = listingStart; id < nextListingId; id++) listingIds.push(id);

  const [offerRows, listingRows] = await Promise.all([
    Promise.all(
      offerIds.map(async id => {
        const hex = await l1Rpc.ethCall(mp, encodeUintArgCall(SELECTORS.offers, id));
        const o = decodeOffer(hex);
        return { offerId: id, ...o, expired: o.expiry > 0 && o.expiry <= nowSec };
      }),
    ),
    Promise.all(
      listingIds.map(async id => {
        const [listHex, retHex] = await Promise.all([
          l1Rpc.ethCall(mp, encodeUintArgCall(SELECTORS.listings, id)),
          l1Rpc.ethCall(mp, encodeAddressUintCall(SELECTORS.pendingReturns, owner, id)),
        ]);
        const l = decodeListing(listHex);
        return {
          listingId: id,
          ...l,
          pendingReturn: decodeSingleUint(retHex),
        };
      }),
    ),
  ]);

  return {
    pendingEthPayout: decodeSingleUint(ethPayoutHex),
    pendingCawPayout: decodeSingleUint(cawPayoutHex),
    nextOfferId,
    nextListingId,
    offerScanTruncated: offerStart > 1,
    listingScanTruncated: listingStart > 1,
    myActiveOffers: offerRows.filter(o => o.active && o.offerer === owner),
    myActiveListings: listingRows.filter(l => l.active && l.seller === owner),
    refundableBids: listingRows.filter(l => l.pendingReturn > 0n),
  };
}

function formatI18n(lang, key, vars = {}) {
  const dict = I18N[lang] || I18N.ja;
  let str = dict[key] ?? I18N.ja[key] ?? key;
  for (const [k, v] of Object.entries(vars)) {
    str = str.replaceAll(`{${k}}`, String(v ?? ''));
  }
  return str;
}

function t(key, vars) {

function esc(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function pill(cls, text) {
  return `<span class="pill ${cls}">${esc(text)}</span>`;
}

function explorerAddrLink(explorerBase, addr) {
  if (!explorerBase || !addr) return `<span class="mono">${esc(addr)}</span>`;
  const url = `${explorerBase.replace(/\/$/, '')}/address/${encodeURIComponent(addr)}`;
  return `<a class="mono" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(addr)} ↗</a>`;
}

function fmtTimestamp(sec) {
  if (!sec) return '-';
  const d = new Date(sec * 1000);
  return d.toLocaleString(lang === 'ja' ? 'ja-JP' : 'en-US');
}

function parseAddrList(raw) {
  return String(raw || '')
    .split(/[\s,]+/)
    .map(s => s.trim())
    .filter(Boolean);
}

function summarizeHealth(sec, profiles, sessData, mp, lookbackBlocks) {
  const cards = [];

  // 1. EIP-7702 delegation
  const d1 = sec.l1Delegation;
  const d2 = sec.l2Delegation;
  const anyDelegated = d1.delegated || d2.delegated;
  const anyUnknownOrContract =
    (d1.delegated && !d1.matchesOfficial && !d1.knownDelegator) ||
    (d2.delegated && !d2.matchesOfficial && !d2.knownDelegator) ||
    (!d1.delegated && !d1.isEoa) ||
    (!d2.delegated && !d2.isEoa);
  const knownNames = [...new Set([d1.knownDelegator?.shortLabel, d2.knownDelegator?.shortLabel].filter(Boolean))];
  if (!anyDelegated && d1.isEoa && d2.isEoa) {
    cards.push({ cls: 'ok', title: t('sum1_title'), status: t('sum1_eoa_st'), desc: t('sum1_eoa_desc') });
  } else if (anyDelegated && !anyUnknownOrContract && knownNames.length === 0) {
    cards.push({ cls: 'ok', title: t('sum1_title'), status: t('sum1_ok_st'), desc: t('sum1_ok_desc') });
  } else if (!anyUnknownOrContract && knownNames.length > 0) {
    cards.push({
      cls: 'info',
      title: t('sum1_title'),
      status: t('sum1_known_st', { name: knownNames.join(' / ') }),
      desc: t('sum1_known_desc'),
    });
  } else {
    cards.push({ cls: 'warn', title: t('sum1_title'), status: t('sum1_warn_st'), desc: t('sum1_warn_desc') });
  }

  // 2. Allowances
  const unlimitedCount = sec.allowances.filter(a => a.unlimited).length;
  const nonZeroCount = sec.allowances.filter(a => a.amount > 0n).length;
  if (nonZeroCount === 0) {
    cards.push({ cls: 'ok', title: t('sum2_title'), status: t('sum2_none_st'), desc: t('sum2_none_desc') });
  } else if (unlimitedCount > 0) {
    cards.push({ cls: 'warn', title: t('sum2_title'), status: t('sum2_unlim_st', { n: unlimitedCount }), desc: t('sum2_unlim_desc') });
  } else {
    cards.push({ cls: 'ok', title: t('sum2_title'), status: t('sum2_part_st', { n: nonZeroCount }), desc: t('sum2_part_desc') });
  }

  // 3. Profiles sync
  if (profiles.length === 0) {
    cards.push({ cls: 'ok', title: t('sum3_title'), status: t('sum3_empty_st'), desc: t('sum3_empty_desc') });
  } else {
    const unsynced = profiles.filter(p => !p.ownerSynced).length;
    const withdrawableCount = profiles.filter(p => p.withdrawable > 0n).length;
    if (unsynced === 0) {
      cards.push({
        cls: 'ok',
        title: t('sum3_title'),
        status: t('sum3_ok_st', { n: profiles.length }),
        desc: withdrawableCount > 0 ? t('sum3_ok_desc_w', { w: withdrawableCount }) : t('sum3_ok_desc'),
      });
    } else {
      cards.push({ cls: 'warn', title: t('sum3_title'), status: t('sum3_warn_st', { u: unsynced }), desc: t('sum3_warn_desc') });
    }
  }

  // 4. L2 Sessions
  const activeSessions = sessData.sessions.filter(s => s.status === 'active').length;
  if (lookbackBlocks === 0 || sessData.logError) {
    cards.push({
      cls: 'warn',
      title: t('sum4_title'),
      status: t('sum4_skip_st'),
      desc: sessData.logError ? t('sum4_skip_err') : t('sum4_skip_off'),
    });
  } else if (activeSessions === 0) {
    cards.push({ cls: 'ok', title: t('sum4_title'), status: t('sum4_ok_st'), desc: t('sum4_ok_desc', { b: lookbackBlocks.toLocaleString() }) });
  } else {
    cards.push({ cls: 'warn', title: t('sum4_title'), status: t('sum4_warn_st', { n: activeSessions }), desc: t('sum4_warn_desc') });
  }

  // 5. Marketplace funds
  const expiredOffers = mp.myActiveOffers.filter(o => o.expired).length;
  const hasFunds = mp.pendingEthPayout > 0n || mp.pendingCawPayout > 0n || mp.refundableBids.length > 0 || expiredOffers > 0;
  if (hasFunds) {
    const parts = [];
    if (mp.pendingEthPayout > 0n || mp.pendingCawPayout > 0n) parts.push(t('part_payout'));
    if (mp.refundableBids.length > 0) parts.push(t('part_bids', { n: mp.refundableBids.length }));
    if (expiredOffers > 0) parts.push(t('part_offers', { n: expiredOffers }));
    cards.push({
      cls: 'warn',
      title: t('sum5_title'),
      status: t('sum5_warn_st', { parts: parts.join(' / ') }),
      desc: t('sum5_warn_desc'),
    });
  } else {
    cards.push({ cls: 'ok', title: t('sum5_title'), status: t('sum5_ok_st'), desc: t('sum5_ok_desc') });
  }

  return cards;
}

function renderDelegationBox(chainLabel, explorerBase, d) {
  let badge = pill('ok', t('del_eoa'));
  let meaning = esc(t('del_eoa_desc'));
  let delegateRow = '';
  if (d.delegated) {
    const linkHtml = explorerAddrLink(explorerBase, d.delegate);
    if (d.matchesOfficial) {
      badge = pill('ok', t('del_off'));
      meaning = esc(t('del_off_desc'));
    } else if (d.knownDelegator) {
      badge = pill('info', t('del_known', { name: d.knownDelegator.shortLabel }));
      meaning = esc(t('del_known_desc', { fullName: d.knownDelegator.label }));
    } else {
      badge = pill('warn', t('del_other'));
      meaning = esc(t('del_other_desc'));
    }
    delegateRow = `<div class="del-addr-row"><span class="del-addr-lbl">delegate</span>${linkHtml}</div>`;
    if (d.managementNonce !== null || d.executeNonce !== null) {
      meaning += `<br>${esc(t('del_nonces', { m: d.managementNonce ?? '-', e: d.executeNonce ?? '-' }))}`;
    }
  } else if (!d.isEoa) {
    badge = pill('warn', t('del_contract', { b: d.codeBytes }));
    meaning = esc(t('del_contract_desc'));
  }

  let eventsHtml = '';
  if (d.eventSummary) {
    const activeCount = d.eventSummary.passkeys.filter(p => p.status === 'active').length;
    const pendingCount = d.eventSummary.passkeys.filter(p => p.status === 'pending').length;
    let txt = t('del_passkeys', { a: activeCount, p: pendingCount });
    if (d.eventSummary.lastFallback) txt += t('del_fallback', { f: shortAddr(d.eventSummary.lastFallback) });
    if (d.logTruncated) txt += t('del_trunc');
    eventsHtml = `<div class="note-line">${esc(txt)}</div>`;
  } else if (d.logError) {
    eventsHtml = `<div class="note-line">${esc(t('del_log_err') + d.logError)}</div>`;
  }

  return `
    <div class="kv-box">
      <div class="kv-k">${esc(chainLabel)} (block #${d.blockNumber.toLocaleString()})</div>
      <div class="kv-v">${badge}</div>
      <div class="note-line">${meaning}</div>
      ${delegateRow}
      ${eventsHtml}
    </div>
  `;
}

      ? pill('warn', label)

  `;
  const logErr = sessData.logError
    ? `<div class="error-box">${esc(t('sess_log_err', { err: sessData.logError }))}</div>`
    : '';

  if (sessData.sessions.length === 0) {
    sessionsSection.innerHTML = `${header}${logErr}<p class="empty">${esc(t('sess_empty'))}</p>`;
    return;
  }

  const statusMeta = s => {
    if (s === 'active') return { badge: pill('ok', t('st_active')), note: t('st_active_note') };
    if (s === 'expired') return { badge: pill('warn', t('st_expired')), note: t('st_expired_note') };
    if (s === 'revoked') return { badge: pill('', t('st_revoked')), note: t('st_revoked_note') };
    if (s === 'invalidated') return { badge: pill('', t('st_invalid')), note: t('st_invalid_note') };
    return { badge: pill('', t('st_unreg')), note: t('st_unreg_note') };
  };

  const rows = sessData.sessions.map(s => {
    const scope = s.scopes.length ? s.scopes.join(', ') : '-';
    const profileScope = s.profileId === 0 ? t('scope_all') : t('scope_one', { id: s.profileId });
    const spentStr = `${s.spent.toLocaleString()} / ${s.spendLimit === 0n ? t('limit_unlim') : s.spendLimit.toLocaleString()} ${symbol}`;
    const meta = statusMeta(s.status);
    return `
      <tr>
        <td>${meta.badge}<span class="hint-sub">${esc(meta.note)}</span></td>
        <td class="mono">${esc(s.sessionKey)}</td>
        <td>${esc(fmtTimestamp(s.expiry))}</td>
        <td>${esc(profileScope)}</td>
        <td>${esc(scope)}</td>
        <td>${esc(spentStr)}</td>
      </tr>
    `;
  }).join('');

  sessionsSection.innerHTML = `
    ${header}${logErr}
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th>${esc(t('th_s_state'))}</th>
            <th>${esc(t('th_s_key'))}</th>
            <th>${esc(t('th_s_exp'))}</th>
            <th>${esc(t('th_s_scope'))}</th>
            <th>${esc(t('th_s_acts'))}</th>
            <th>${esc(t('th_s_spent'))}</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

function fmtPaymentAmount(amount, paymentToken, cawDecimals, cawSymbol) {
  if (paymentToken === ZERO_ADDRESS) {
    return `${formatUnits(amount, 18)} ETH`;
  }
  if (paymentToken.toLowerCase() === preset.contracts.L1.MintableCaw.toLowerCase()) {
    return `${formatUnits(amount, cawDecimals)} ${cawSymbol}`;
  }
  return `${formatUnits(amount, 18)} (${shortAddr(paymentToken)})`;
}

function renderMarketplace(mp, decimals, symbol) {
  const offersRows = mp.myActiveOffers.map(o => `
    <tr>
      <td>#${o.offerId}</td>
      <td>#${o.tokenId}</td>
      <td>${esc(fmtPaymentAmount(o.amount, o.paymentToken, decimals, symbol))}</td>
      <td>${esc(fmtTimestamp(o.expiry))}</td>
      <td>${o.expired ? pill('warn', t('offer_exp')) : pill('ok', t('offer_act'))}</td>
    </tr>
  `).join('');

  const bidRows = mp.refundableBids.map(b => `
    <tr>
      <td>#${b.listingId}</td>
      <td>#${b.tokenId}</td>
      <td>${esc(formatUnits(b.pendingReturn, 18))} ETH</td>
      <td>${b.active ? pill('warn', t('bid_act')) : pill('warn', t('bid_end'))}</td>
    </tr>
  `).join('');

  const listingRows = mp.myActiveListings.map(l => `
    <tr>
      <td>#${l.listingId}</td>
      <td>#${l.tokenId}</td>
      <td>${esc(l.listingType)}</td>
      <td>${esc(fmtPaymentAmount(l.startPrice, l.paymentToken, decimals, symbol))}</td>
      <td>${l.highestBid > 0n ? esc(fmtPaymentAmount(l.highestBid, l.paymentToken, decimals, symbol)) : '-'}</td>
    </tr>
  `).join('');

  marketplaceSection.innerHTML = `
    <div class="sec-guide">${esc(t('mp_guide'))}</div>
    <div class="kv-grid">
      <div class="kv-box">
        <div class="kv-k">${esc(t('mp_eth_pay'))}</div>
        <div class="kv-v">${mp.pendingEthPayout > 0n ? pill('warn', `${formatUnits(mp.pendingEthPayout, 18)} ETH ${t('mp_claimable')}`) : `${esc(formatUnits(mp.pendingEthPayout, 18))} ETH`}</div>
      </div>
      <div class="kv-box">
        <div class="kv-k">${esc(t('mp_caw_pay', { sym: symbol }))}</div>
        <div class="kv-v">${mp.pendingCawPayout > 0n ? pill('warn', `${formatUnits(mp.pendingCawPayout, decimals)} ${symbol} ${t('mp_claimable')}`) : `${esc(formatUnits(mp.pendingCawPayout, decimals))} ${esc(symbol)}`}</div>
      </div>
      <div class="kv-box">
        <div class="kv-k">${esc(t('mp_total'))}</div>
        <div class="kv-v">Offers: ${Math.max(0, mp.nextOfferId - 1)} / Listings: ${Math.max(0, mp.nextListingId - 1)}</div>
      </div>
    </div>
    ${offersRows ? `
      <h3>${esc(t('mp_h_offers'))}</h3>
      <div class="tbl-wrap"><table><thead><tr><th>${esc(t('th_oid'))}</th><th>${esc(t('th_tok'))}</th><th>${esc(t('th_dep'))}</th><th>${esc(t('th_exp'))}</th><th>${esc(t('th_st'))}</th></tr></thead><tbody>${offersRows}</tbody></table></div>
    ` : `<p class="empty">${esc(t('mp_no_offers'))}</p>`}
    ${bidRows ? `
      <h3>${esc(t('mp_h_bids'))}</h3>
      <div class="tbl-wrap"><table><thead><tr><th>${esc(t('th_lid'))}</th><th>${esc(t('th_tok'))}</th><th>${esc(t('th_ref'))}</th><th>${esc(t('th_st'))}</th></tr></thead><tbody>${bidRows}</tbody></table></div>
    ` : `<p class="empty">${esc(t('mp_no_bids'))}</p>`}
    ${listingRows ? `
      <h3>${esc(t('mp_h_listings'))}</h3>
      <div class="tbl-wrap"><table><thead><tr><th>${esc(t('th_lid'))}</th><th>${esc(t('th_tok'))}</th><th>${esc(t('th_ltype'))}</th><th>${esc(t('th_startp'))}</th><th>${esc(t('th_hbid'))}</th></tr></thead><tbody>${listingRows}</tbody></table></div>
    ` : ''}
  `;
}

function renderTransparency(l1Url, l2Url) {
  const rows = [
    ['L1 RPC', l1Url],
    ['L2 RPC', l2Url],
    ['L1 MintableCaw', preset.contracts.L1.MintableCaw],
    ['L1 CawProfile', preset.contracts.L1.CawProfile],
    ['L1 CawProfileLens', preset.contracts.L1.CawProfileLens],
    ['L1 CawProfileMinter', preset.contracts.L1.CawProfileMinter],
    ['L1 CawProfileMarketplace', preset.contracts.L1.CawProfileMarketplace],
    ['L1/L2 SmartEOA', preset.contracts.L1.SmartEOA],
    ['L2 CawProfileLedger', preset.contracts.L2.CawProfileLedger],
    ['L2 CawActions', preset.contracts.L2.CawActions],
  ].map(([k, v]) => `<tr><td>${esc(k)}</td><td class="mono">${esc(v)}</td></tr>`).join('');

  transparencySection.innerHTML = `<div class="tbl-wrap"><table><tbody>${rows}</tbody></table></div>`;
}

function renderAllSnapshot() {
  if (!lastSnapshot) return;
  const { target, security, profiles, sessions, marketplace, l2Block, networkId, lookbackBlocks, l1Url, l2Url } = lastSnapshot;
  const summaryCards = summarizeHealth(security, profiles, sessions, marketplace, lookbackBlocks);
  renderResolved(target, security.l1Delegation.blockNumber, l2Block, networkId);
  renderHealthSummary(summaryCards);
  renderSecurity(security);
  renderProfiles(profiles, security.caw.decimals, security.caw.symbol);
  renderSessions(sessions, security.caw.decimals, security.caw.symbol);
  renderMarketplace(marketplace, security.caw.decimals, security.caw.symbol);
  renderTransparency(l1Url, l2Url);
}

function applyLang() {
  document.documentElement.lang = lang;
  for (const btn of langSeg.querySelectorAll('button[data-lang]')) {
    btn.setAttribute('aria-pressed', btn.dataset.lang === lang ? 'true' : 'false');
  }
  for (const el of document.querySelectorAll('[data-i18n]')) {
    el.textContent = t(el.dataset.i18n);
  }
  for (const el of document.querySelectorAll('[data-i18n-placeholder]')) {
    el.setAttribute('placeholder', t(el.dataset.i18nPlaceholder));
  }
  renderAllSnapshot();
}

langSeg.addEventListener('click', (ev) => {
  const btn = ev.target.closest('button[data-lang]');
  if (!btn) return;
  const next = btn.dataset.lang;
  if (next !== 'ja' && next !== 'en') return;
  lang = next;
  try { localStorage.setItem(LANG_KEY, lang); } catch {}
  applyLang();
});

applyLang();

form.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  errorBox.hidden = true;
  resultsEl.hidden = true;
  statusBar.hidden = false;
  statusBar.textContent = t('status_querying');
  inspectBtn.disabled = true;

  try {
    const l1Url = l1RpcInput.value.trim();
    const l2Url = l2RpcInput.value.trim();
    const networkId = Number(networkIdInput.value) || 1;
    const lookbackBlocks = Number(logBlocksSelect.value) || 0;
    const extraSessionKeys = parseAddrList(extraSessionKeysInput.value);
    const extraSpenders = parseAddrList(extraSpendersInput.value);

    const l1Rpc = createRpcClient(l1Url, { expectedChainId: preset.l1ChainId });
    const l2Rpc = createRpcClient(l2Url, { expectedChainId: preset.l2ChainId });

    const target = await resolveTarget(l1Rpc, targetInput.value, preset.contracts.L1);
    statusBar.textContent = t('status_fetching', { addr: target.address });

    const [security, profiles, l2Block, marketplace] = await Promise.all([
      inspectAccountSecurity(l1Rpc, l2Rpc, target.address, preset.contracts, {
        lookbackBlocks,
        extraSpenders,
      }),
      inspectProfiles(l1Rpc, l2Rpc, target.address, networkId, preset.contracts),
      l2Rpc.getBlockNumber(),
      inspectMarketplace(l1Rpc, target.address, preset.contracts),
    ]);

    const sessions = await inspectSessions(l2Rpc, target.address, l2Block, preset.contracts, {
      lookbackBlocks,
      extraSessionKeys,
    });

    lastSnapshot = {
      target,
      security,
      profiles,
      sessions,
      marketplace,
      l2Block,
      networkId,
      lookbackBlocks,
      l1Url,
      l2Url,
    };

    renderAllSnapshot();

    statusBar.hidden = true;
    resultsEl.hidden = false;
  } catch (err) {
    statusBar.hidden = true;
    errorBox.hidden = false;
    errorBox.textContent = t('err_prefix') + (err?.message || String(err));
  } finally {
    inspectBtn.disabled = false;
  }
});

})();
  </script>
</body>
</html>
